worker_processes  1;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
            record off;
        }
    }
}

http {
    # 只包含预定义的 MIME 类型
    include       mime.types;
    default_type  application/octet-stream;

    # 基本服务器设置
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  0.0.0.0;

        location /hls {
            root   /var/www/html;
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*' always;

            # 确保正确处理 HLS 文件
            location ~ \.(m3u8)$ {
                add_header Cache-Control no-cache;
                add_header 'Access-Control-Allow-Origin' '*' always;
                expires -1;
            }

            location ~ \.(ts)$ {
                add_header Cache-Control no-cache;
                add_header 'Access-Control-Allow-Origin' '*' always;
                expires 30d;
            }
        }
    }
}